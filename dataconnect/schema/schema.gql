type User @table {
  displayName: String!
  role: String!
  createdAt: Timestamp!
  email: String
  phoneNumber: String
  department: String
}

type Patient @table {
  firstName: String!
  lastName: String!
  dateOfBirth: Date!
  gender: String!
  admissionDate: Timestamp!
  contactNumber: String
  address: String
  bloodGroup: String
  assignedDoctor: User
}

type Appointment @table {
  patient: Patient!
  staff: User!
  appointmentDateTime: Timestamp!
  status: String!
  notes: String
  reason: String
}

type MedicalRecord @table {
  patient: Patient!
  doctor: User!
  recordDate: Timestamp!
  diagnosis: String!
  treatmentPlan: String
  observations: String
  allergies: String
}

type Prescription @table {
  patient: Patient!
  doctor: User!
  medicationName: String!
  dosage: String!
  frequency: String!
  prescribedDate: Timestamp!
  instructions: String
  startDate: Date
  endDate: Date
}